# Mises à jour weekly, mineures/patch.
# Pas de groupe Composer : un groupe unique a déjà tenté de rétrograder Symfony
# en bumpant Laravel. Les majors (Vitest 4, actions/checkout v7) restent manuelles.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/ui"
        update-types:
          - version-update:semver-major

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        update-types:
          - minor
          - patch
        patterns:
          - "*"
