# Mises à jour groupées, mineures/patch uniquement.
# Les majors (ex. Vitest 4) restent un chantier dédié, pas une PR automatique.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: vitest
        update-types:
          - version-update:semver-major
      - dependency-name: "@vitest/ui"
        update-types:
          - version-update:semver-major

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      composer-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
