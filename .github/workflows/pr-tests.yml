# Tests PHPUnit sur chaque pull_request (branches vers la branche par défaut).
# Base MySQL : alignée sur phpunit.xml (krosmoz_testing). Durée : proche du run local (~25–30 min) tant que toute la suite Feature tourne.
#
# Exécution « interne » : remplacez `runs-on: ubuntu-latest` par `runs-on: [self-hosted, linux]` (ou vos labels)
# et installez un GitHub Actions self-hosted runner sur votre infra.
#
# @see https://docs.github.com/en/actions/hosting-your-own-runners/managing-self-hosted-runners/about-self-hosted-runners
name: PR — PHPUnit

on:
  pull_request:
    # Limite aux branches cibles courantes ; retirez `branches` pour lancer sur toute PR.
    branches:
      - main
      - master
      - develop

concurrency:
  group: pr-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit (MySQL)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: krosmoz_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: krosmoz_testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, mysql, pdo_mysql, bcmath, gd, intl, zip
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3
        with:
          composer-options: '--prefer-dist --no-interaction --no-progress'

      - name: Prepare application key
        run: |
          test -f .env || cp .env.example .env
          php artisan key:generate --force

      - name: Wait for MySQL (port 3306)
        shell: bash
        run: |
          for _ in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1

      - name: Run migrations (testing DB)
        run: php artisan migrate --force --no-interaction

      - name: Run PHPUnit
        run: php artisan test --no-interaction
