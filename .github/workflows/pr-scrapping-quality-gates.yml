# Quality gates scrapping (CI)

# Audits structurels / seuils conversion sans dépendre d'un import massif local.
# Tourne en complément de PHPUnit sur les PR vers main/master/develop.

name: PR — Scrapping quality gates

on:
  pull_request:
    branches:
      - main
      - master
      - develop

concurrency:
  group: pr-scrapping-gates-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scrapping-gates:
    name: Scrapping & characteristic gates
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: krosmoz_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: krosmoz_testing
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, xml, mysql, pdo_mysql, bcmath, gd, intl, zip
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          composer-options: '--prefer-dist --no-interaction --no-progress'

      - name: Prepare application key
        run: |
          test -f .env || cp .env.example .env
          php artisan key:generate --force

      - name: Wait for MySQL
        shell: bash
        run: |
          for _ in {1..60}; do
            (echo > /dev/tcp/127.0.0.1/3306) >/dev/null 2>&1 && exit 0
            sleep 2
          done
          exit 1

      - name: Migrate & bootstrap scrapping socle
        run: |
          php artisan migrate --force --no-interaction
          php artisan scrapping:setup --skip-migrate

      - name: Audit characteristic definitions (JSON)
        run: php artisan characteristics:audit-definitions

      - name: Effects quality gate (base vide autorisée)
        run: php artisan scrapping:effects:quality-gate --allow-empty --min-coverage=99 --max-missing-mappings=0

      - name: Scrapping audit (fail on review)
        run: php artisan scrapping:audit --fail-on-review

      - name: Unit tests conversion samples
        run: php vendor/bin/phpunit --filter 'Characteristic(Creature|Object|Spell)DefinitionQuality|CharacteristicDefinitionQualityService'
